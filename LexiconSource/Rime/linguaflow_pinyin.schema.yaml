schema:
  schema_id: linguaflow_pinyin
  name: LinguaFlow Pinyin
  version: "2026.09.01"

engine:
  processors:
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
    - fallback_segmentor
  translators:
    - script_translator
  filters:
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba'
  delimiter: " '"
  algebra:
    - derive/^([a-z]).+$/$1/
    - derive/^([zcs]h).+$/$1/

translator:
  dictionary: linguaflow_pinyin
  enable_sentence: true
  enable_completion: true
  enable_user_dict: true
  spelling_hints: 8
